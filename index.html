<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог настільних ігор</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Шапка з навігацією -->
    <header>
        <h1>Каталог настільних ігор</h1>
        <nav>
            <a href="#filters">Фільтри</a>
            <a href="#games">Список ігор</a>
        </nav>
    </header>

    <!-- Основний вміст -->
    <main>
        <!-- Блок фільтрів -->
        <section id="filters">
            <h2>Фільтри</h2>
            <form action="#" method="GET">
                <label for="player-count">Кількість гравців:</label>
                <input type="number" id="player-count" name="players" min="1" max="10">
            </form>
        </section>

  <!-- Список карток ігор -->
<section id="games">
    <h2>Ігри</h2>
    
    <div class="cards"> 
        
        <article>
            <h3>Каркассон</h3>
            <img src="assets/img/carcassonne.jpg" alt="Коробка настільної гри Каркассон">
            <p>Класична гра на вибудовування міст та доріг.</p>
        </article>

        <article>
            <h3>Манчкін</h3>
            <img src="assets/img/munchkin.jpg" alt="Картка з настільної гри Манчкін">
            <p>Весела карткова гра про зачистку підземель.</p>
        </article>
    </div> 
    
</section>
    </main>

    <!-- Підвал -->
    <footer>
        <p>Виконав: Ілля Гончар, 2026. Навчальний проєкт.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
